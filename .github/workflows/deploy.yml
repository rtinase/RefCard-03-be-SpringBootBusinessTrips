name: Test, Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests ausführen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Tests ausführen
        run: ./mvnw test

  build:
    name: Jar bauen
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Jar bauen
        run: ./mvnw clean package -DskipTests

      - name: Jar als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  deploy:
    name: Jar auf EC2 deployen
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    steps:
      - name: Jar-Artefakt laden
        uses: actions/download-artifact@v4
        with:
          name: app-jar

      - name: SSH-Key einrichten
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Jar per rsync auf EC2 uebertragen
        run: |
          JAR=$(ls *.jar | grep -v plain | head -n 1)
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" "$JAR" \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/businesstrips/app.jar

      - name: Service neu starten
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo systemctl restart businesstrips.service"

      - name: SSH-Key entfernen
        if: always()
        run: rm -f ~/.ssh/deploy_key
